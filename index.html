        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        
        body { font-family: 'Inter', sans-serif; overflow: hidden; transition: background-color 0.3s, color 0.3s; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { border-radius: 20px; }
        
        /* Tema Değişkenleri ve Geçişleri */
        .theme-dark { background-color: #000000; color: #f1f5f9; }
        .theme-dark .bg-app-header { background-color: #000000; border-bottom: 1px solid #27272a; }
        .theme-dark .bg-app-chat { background-color: #000000; }
        .theme-dark .bg-app-input-container { background-color: #000000; border-top: 1px solid #18181b; }
        .theme-dark .bg-app-input-box { background-color: #09090b; border: 1px solid #27272a; }
        .theme-dark .text-app-main { color: #f1f5f9; }
        .theme-dark .text-app-sub { color: #71717a; }
        .theme-dark .bg-app-bubble-ai { background-color: #09090b; border: 1px solid #27272a; color: #e2e8f0; }
        .theme-dark .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #27272a; }
        .theme-dark .bg-app-header-display { background-color: rgba(39, 39, 42, 0.5); border: 1px solid #27272a; }
        .theme-dark .bg-app-modal { background-color: #09090b; border: 1px solid #27272a; color: #f1f5f9; }
        .theme-dark .input-app-field { background-color: #000000; border: 1px solid #27272a; color: #f1f5f9; }

        .theme-light { background-color: #f8fafc; color: #0f172a; }
        .theme-light .bg-app-header { background-color: #ffffff; border-bottom: 1px solid #e2e8f0; }
        .theme-light .bg-app-chat { background-color: #f8fafc; }
        .theme-light .bg-app-input-container { background-color: #ffffff; border-top: 1px solid #e2e8f0; }
        .theme-light .bg-app-input-box { background-color: #f1f5f9; border: 1px solid #cbd5e1; }
        .theme-light .text-app-main { color: #0f172a; }
        .theme-light .text-app-sub { color: #64748b; }
        .theme-light .bg-app-bubble-ai { background-color: #ffffff; border: 1px solid #e2e8f0; color: #334155; }
        .theme-light .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; }
        .theme-light .bg-app-header-display { background-color: rgba(241, 245, 249, 0.8); border: 1px solid #cbd5e1; }
        .theme-light .bg-app-modal { background-color: #ffffff; border: 1px solid #cbd5e1; color: #0f172a; }
        .theme-light .input-app-field { background-color: #f1f5f9; border: 1px solid #cbd5e1; color: #0f172a; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }

        @keyframes scaleIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .animate-scale-in { animation: scaleIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

        .loader { border: 2px solid #18181b; border-radius: 50%; border-top: 2px solid #f59e0b; width: 16px; height: 16px; animation: spin 1s linear infinite; }
        .theme-light .loader { border: 2px solid #e2e8f0; border-top: 2px solid #f59e0b; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .code-block-wrapper {
            position: relative; margin: 0.75rem 0; border-radius: 0.5rem;
            overflow: hidden; border: 1px solid #27272a; background-color: #09090b; 
        }
        .theme-light .code-block-wrapper {
            border: 1px solid #cbd5e1; background-color: #1e293b;
        }
        .code-block-header {
            display: flex; justify-content: space-between; align-items: center;
            background-color: #000000; padding: 0.5rem 1rem; color: #e2e8f0;
            font-family: monospace; font-size: 0.75rem; border-bottom: 1px solid #27272a;
        }
        .theme-light .code-block-header {
            background-color: #0f172a; border-bottom: 1px solid #334155;
        }
        .copy-btn {
            background-color: #18181b; color: white; padding: 0.25rem 0.75rem;
            border-radius: 0.375rem; cursor: pointer; font-size: 0.75rem; transition: all 0.2s;
            display: none; /* Yazma bitene kadar gizlidir */
        }
        .copy-btn:hover {
            background-color: #27272a;
        }
        .code-content {
            padding: 1rem; overflow-x: auto; color: #f8fafc;
            font-family: 'Menlo', 'Monaco', 'Courier New', monospace; font-size: 0.875rem;
            line-height: 1.5; white-space: pre;
        }
        
        .typing-cursor::after {
            content: '|'; animation: blink 1s step-start infinite;
            color: #f59e0b; font-weight: bold; margin-left: 2px;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* Mesaj Durduruldu Stili */
        .status-aborted {
            color: #ef4444; font-weight: bold; font-size: 0.8rem; margin-top: 8px;
            display: flex; align-items: center; gap: 4px;
        }
    </style>
</head>

    <script>
        function safeCreateIcons() { if (typeof lucide !== 'undefined') lucide.createIcons(); }
        
        let globalApiKey = ""; 
        let isTyping = false;
        let chatHistory = []; 
        let currentAbortController = null;
        let isKeyVisible = false;

        const chatArea = document.getElementById('chat-area');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const stopBtn = document.getElementById('stop-btn');
        const welcomeScreen = document.getElementById('welcome-screen');
        const apiKeyScreen = document.getElementById('api-key-screen');
        const mainApp = document.getElementById('main-app'); 
        const statusModal = document.getElementById('status-modal');
        const settingsModal = document.getElementById('settings-modal');

        // Tema Yönetimi
        function setTheme(theme) {
            const body = document.body;
            const darkBtn = document.getElementById('theme-btn-dark');
            const lightBtn = document.getElementById('theme-btn-light');
            
            if (theme === 'light') {
                body.className = "h-screen flex theme-light";
                localStorage.setItem('baklavaTheme', 'light');
                
                // Buton Durumları
                lightBtn.className = "flex items-center justify-center gap-2 p-3 rounded-xl border border-amber-600 bg-amber-600/10 text-amber-500 font-semibold transition-all";
                darkBtn.className = "flex items-center justify-center gap-2 p-3 rounded-xl border-zinc-200 bg-white hover:bg-zinc-100 text-zinc-600 font-semibold transition-all";
            } else {
                body.className = "h-screen flex theme-dark";
                localStorage.setItem('baklavaTheme', 'dark');
                
                // Buton Durumları
                darkBtn.className = "flex items-center justify-center gap-2 p-3 rounded-xl border border-amber-600 bg-amber-600/10 text-amber-500 font-semibold transition-all";
                lightBtn.className = "flex items-center justify-center gap-2 p-3 rounded-xl border-zinc-800 bg-zinc-900/50 text-zinc-400 font-semibold transition-all";
            }
            safeCreateIcons();
        }

        function loadSavedTheme() {
            const savedTheme = localStorage.getItem('baklavaTheme') || 'dark';
            setTheme(savedTheme);
        }

        // Ayarlar Sayfası İşlemleri
        function openSettingsModal() {
            // Kayıtlı verileri yükle
            document.getElementById('user-nickname-input').value = localStorage.getItem('userNickname') || "";
            document.getElementById('custom-instructions-input').value = localStorage.getItem('customInstructions') || "";
            settingsModal.classList.remove('opacity-0', 'pointer-events-none');
            safeCreateIcons();
        }

        function closeSettingsModal() {
            settingsModal.classList.add('opacity-0', 'pointer-events-none');
        }

        // Ayarları Kaydetme Fonksiyonu
        function saveSettings() {
            const nicknameInput = document.getElementById('user-nickname-input').value.trim();
            const customInstructions = document.getElementById('custom-instructions-input').value.trim();
            localStorage.setItem('userNickname', nicknameInput);
            localStorage.setItem('customInstructions', customInstructions);
            closeSettingsModal();
        }

        function checkApiKey() {
            loadSavedTheme(); // Tema kontrolünü arayüz yüklenirken yapıyoruz
            const storedKey = localStorage.getItem('groqApiKey');
            if (storedKey) {
                globalApiKey = storedKey;
                apiKeyScreen.style.display = 'none';
                mainApp.classList.remove('opacity-0', 'pointer-events-none');
                mainApp.style.opacity = '1';
                updateApiStatus(true);
                updateMaskedKey();
            } else {
                apiKeyScreen.style.display = 'flex';
                updateApiStatus(false);
            }
            safeCreateIcons();
        }

        function showStatus(type, title, desc) {
            const iconCont = document.getElementById('status-icon-container');
            const titleEl = document.getElementById('status-title');
            const descEl = document.getElementById('status-desc');
            const btn = document.getElementById('status-close-btn');
            if (type === 'success') {
                iconCont.className = "w-20 h-20 mx-auto mb-4 rounded-full flex items-center justify-center bg-green-500/10 text-green-500 border border-green-500/20";
                iconCont.innerHTML = '<i data-lucide="check-circle-2" class="w-10 h-10"></i>';
                btn.className = "w-full py-3 rounded-xl font-bold bg-green-600 hover:bg-green-700 text-white";
                btn.textContent = "Başla";
                btn.onclick = () => { closeStatusModal(); checkApiKey(); };
            } else if (type === 'error') {
                iconCont.className = "w-20 h-20 mx-auto mb-4 rounded-full flex items-center justify-center bg-red-500/10 text-red-500 border border-red-500/20";
                iconCont.innerHTML = '<i data-lucide="x-circle" class="w-10 h-10"></i>';
                btn.className = "w-full py-3 rounded-xl font-bold bg-zinc-800 hover:bg-zinc-700 text-white";
                btn.textContent = "Tekrar Dene";
                btn.onclick = closeStatusModal;
            } else if (type === 'loading') {
                iconCont.className = "w-20 h-20 mx-auto mb-4 rounded-full flex items-center justify-center bg-amber-500/10 text-amber-500 border border-amber-500/20";
                iconCont.innerHTML = '<div class="loader !w-8 !h-8 !border-[4px]"></div>';
                btn.className = "hidden";
            }
            titleEl.textContent = title;
            descEl.textContent = desc;
            statusModal.classList.remove('opacity-0', 'pointer-events-none');
            safeCreateIcons();
        }

        function closeStatusModal() { statusModal.classList.add('opacity-0', 'pointer-events-none'); }

        async function saveApiKey() {
            const input = document.getElementById('api-key-input').value.trim();
            if (!input.startsWith('gsk_')) { showStatus('error', 'Hatalı Format', 'Anahtar gsk_ ile başlamalı.'); return; }
            showStatus('loading', 'Bağlanıyor', 'Kontrol ediliyor...');
            try {
                const res = await fetch("https://api.groq.com/openai/v1/models", { headers: { "Authorization": `Bearer ${input}` } });
                if (!res.ok) throw new Error();
                localStorage.setItem('groqApiKey', input);
                globalApiKey = input;
                setTimeout(() => showStatus('success', 'Hazır!', 'Anahtar onaylandı.'), 600);
            } catch (e) {
                setTimeout(() => showStatus('error', 'Geçersiz', 'Anahtar hatalı olabilir.'), 600);
            }
        }

        function updateApiStatus(ok) {
            const el = document.getElementById('api-status-indicator');
            if(!el) return;
            el.textContent = ok ? "BAKLAVA v4.0 AKTİF" : "API Bekleniyor";
            el.className = ok ? 'text-[10px] px-2 py-0.5 rounded border border-green-900 text-green-500 bg-green-950/20' : 'text-[10px] px-2 py-0.5 rounded border border-zinc-800 text-zinc-500';
        }

        function updateMaskedKey() {
            const el = document.getElementById('api-key-masked');
            if(!el) return;
            el.textContent = isKeyVisible ? globalApiKey : globalApiKey.substring(0, 7) + "..." + globalApiKey.substring(globalApiKey.length - 4);
        }

        function toggleKeyVisibility() {
            isKeyVisible = !isKeyVisible;
            document.getElementById('eye-icon').setAttribute('data-lucide', isKeyVisible ? 'eye-off' : 'eye');
            safeCreateIcons();
            updateMaskedKey();
        }

        function clearApiKeyAndRefresh() { localStorage.removeItem('groqApiKey'); window.location.reload(); }
        
        function clearChat() {
            window.location.reload();
        }

        function abortGeneration() { 
            if (currentAbortController) { 
                currentAbortController.abort(); 
                isTyping = false; 
                sendBtn.classList.remove('hidden'); 
                stopBtn.classList.add('hidden');
                
                const lastMsg = chatArea.lastElementChild;
                if (lastMsg && lastMsg.querySelector('.typing-cursor')) {
                    const typingEl = lastMsg.querySelector('.typing-cursor');
                    typingEl.classList.remove('typing-cursor');
                    const abortMarker = document.createElement('div');
                    abortMarker.className = 'status-aborted';
                    abortMarker.innerHTML = '<i data-lucide="circle-off" class="w-3 h-3"></i> Mesaj Durduruldu.';
                    typingEl.appendChild(abortMarker);
                    
                    const rawText = typingEl.dataset.rawText || "";
                    typingEl.innerHTML = formatMessageText(rawText, true);
                    typingEl.appendChild(abortMarker);
                }
                
                if (chatHistory.length > 0) {
                    const lastItem = chatHistory[chatHistory.length - 1];
                    if (lastItem.role === 'assistant') {
                        chatHistory.pop();
                    }
                    if (chatHistory.length > 0 && chatHistory[chatHistory.length - 1].role === 'user') {
                        chatHistory.pop();
                    }
                }
                safeCreateIcons();
            } 
        }

        function formatMessageText(text, showCopy = false) {
            let formatted = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            
            let parsedText = formatted;
            let openMatches = (parsedText.match(/```/g) || []).length;
            if (openMatches % 2 !== 0) {
                parsedText += "\n```"; 
            }

            let codeBlocks = [];
            parsedText = parsedText.replace(/```(\w*)[ \t]*\n?([\s\S]*?)```/g, (match, lang, code) => {
                let rawCode = code.endsWith('\n') ? code.slice(0, -1) : code;
                codeBlocks.push({ lang: lang || 'KOD', code: rawCode });
                return `___CODE_BLOCK_${codeBlocks.length - 1}___`;
            });

            parsedText = parsedText.replace(/\n/g, '<br>');
            parsedText = parsedText.replace(/___CODE_BLOCK_(\d+)___/g, (match, index) => {
                const block = codeBlocks[index];
                const copyStyle = showCopy ? 'display: block;' : 'display: none;';
                return `<div class="code-block-wrapper"><div class="code-block-header"><span class="text-amber-500 font-bold">${block.lang.toUpperCase()}</span><button class="copy-btn" style="${copyStyle}" onclick="copyCode(this)">Kopyala</button></div><pre class="code-content">${block.code}</pre></div>`;
            });
            return parsedText;
        }

        window.copyCode = function(button) {
            const codeText = button.closest('.code-block-wrapper').querySelector('pre').textContent;
            const textArea = document.createElement("textarea");
            textArea.value = codeText; document.body.appendChild(textArea); textArea.select();
            document.execCommand('copy'); document.body.removeChild(textArea);
            button.textContent = "Tamam!";
            setTimeout(() => button.textContent = "Kopyala", 2000);
        };

        function addMessage(text, isUser) { 
            welcomeScreen.style.display = 'none';
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex w-full ${isUser ? 'justify-end' : 'justify-start'} animate-fade-in gap-3`;
            const contentDiv = document.createElement('div');
            contentDiv.className = `max-w-[85%] p-4 rounded-2xl ${isUser ? 'bg-amber-600 text-white ml-auto shadow-lg' : 'bg-app-bubble-ai'}`;
            
            const innerMsg = document.createElement('div');
            if (!isUser && text === null) {
                innerMsg.className = 'flex items-center gap-2';
                innerMsg.innerHTML = '<div class="loader"></div> <span class="text-xs text-zinc-500 italic">Zekice Düşünüyor...</span>';
            } else if (!isUser) {
                innerMsg.className = 'typing-cursor';
                innerMsg.innerHTML = formatMessageText(text || '', false); 
            } else {
                innerMsg.innerHTML = formatMessageText(text, true); 
            }
            contentDiv.appendChild(innerMsg); msgDiv.appendChild(contentDiv); chatArea.appendChild(msgDiv);
            scrollToBottom(); return innerMsg;
        }

        async function typeWriter(text, element) {
            element.innerHTML = '';
            let currentText = '';
            const chars = Array.from(text);
            for (let i = 0; i < chars.length; i++) {
                if (!isTyping) break; 
                currentText += chars[i];
                element.dataset.rawText = currentText;
                element.innerHTML = formatMessageText(currentText, false); 
                if (i % 8 === 0) scrollToBottom();
                await new Promise(r => setTimeout(r, 8));
            }
            if (isTyping) {
                element.innerHTML = formatMessageText(text, true); 
                element.classList.remove('typing-cursor');
            }
        }

        function scrollToBottom() { chatArea.scrollTo({ top: chatArea.scrollHeight, behavior: 'smooth' }); }

        async function handleSend() {
            const text = userInput.value.trim();
            if (!text || isTyping) return;
            isTyping = true;
            btn_el = document.getElementById('send-btn');
            btn_el.className = 'hidden';
            stopBtn.className = 'mb-1 p-3.5 text-red-500 hover:bg-red-500/10 rounded-2xl block';
            
            addMessage(text, true);
            chatHistory.push({ role: "user", content: text });
            userInput.value = '';
            
            const aiWrapper = addMessage(null, false);
            currentAbortController = new AbortController();
            
            try {
                const url = "https://api.groq.com/openai/v1/chat/completions";
                
                const now = new Date();
                const dateStr = now.toLocaleDateString('tr-TR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                const timeStr = now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });

                // Hitap Şekli Tanımlaması
                const savedNickname = localStorage.getItem('userNickname') || "";
                
                // Özel Talimatlar Tanımlaması
                const customInstructions = localStorage.getItem('customInstructions') || "";
                const customInstructionsPrompt = customInstructions 
                    ? `Kullanıcının senden uymanı istediği Özel Talimatlar şunlardır, bu kurallara kesinlikle uyacaksın: "${customInstructions}"`
                    : "";

                // GELİŞTİRİLMİŞ SİSTEM PROMPTU (Geliştirici TURKOMEN'in Yetenekleri, Hitap Şekli, Özel Talimatlar ve Harika Şaka Dinamikleri Tanıtıldı)
                const systemPrompt = {
                    role: "system",
                    content: `Sen BAKLAVA AI'sın. Seni geliştiren, kuran ve tasarlayan kişi tek başına "TURKOMEN"dir. "TURKOMEN" biricik ve özel bir geliştirici adıdır (developer nickname). "TURKOMEN" kelimesi asla ve hiçbir koşulda "Türkmenistan" ülkesiyle, "Türkmen" halkıyla ya da "Turkmen" etnik kimliğiyle karıştırılmamalı, bağdaştırılmamalı ve bu şekilde tanımlanmamalıdır.
                    
                    KULLANICI VE ADI/KİMLİĞİ İLE İLGİLİ STRATEJİK KURALLAR:
                    1. Eğer kullanıcı "adım ne?", "ben kimim?", "beni tanıyor musun?" gibi kendisiyle, ismiyle ya da kimliğiyle ilgili bir soru sorarsa:
                       - Eğer bir hitap şekli girilmemişse (yani 'savedNickname' değeri boş ise), kesinlikle başka bir isim uydurmayacak ve geliştirici TURKOMEN'i anlatmayacaksın! Doğrudan ve tam olarak şu yanıtı vereceksin: "Sizi tanıyabilmem için lütfen Ayarlar kısmından bir hitap şekli girin."
                       - Eğer bir hitap şekli girilmişse (yani 'savedNickname' dolu ise ve değeri "${savedNickname}" ise), doğrudan şu kalıpta cevap vereceksin: "Sizin adınız ${savedNickname}." veya "Sizi ${savedNickname} olarak tanıyorum." Bu kurala kesinlikle uy.
                    
                    2. Merhaba veya Selamlama Kuralları:
                       - Kullanıcı "Merhaba" veya benzeri bir selamlama yazdığında, eğer hitap şekli girilmişse ("${savedNickname}" dolu ise), robotik olarak "Sizi ${savedNickname} olarak görüyorum" demeyeceksin. Çok samimi ve doğal bir şekilde "Merhaba ${savedNickname}, bugün nasılsınız?" veya benzeri sıcak bir selamlama yapacaksın.
                       - Eğer hitap şekli boşsa, normal ve kibar bir dille selamlama yapacaksın.
                    
                    3. TURKOMEN (Geliştiricin) Hakkında Kural:
                       - Sadece ve sadece doğrudan "TURKOMEN kimdir?", "Geliştiricin kim?", "Seni kim yaptı?" gibi geliştirici odaklı sorular sorulursa TURKOMEN'i tanıtacaksın. Diğer durumlarda TURKOMEN'i kendiliğinden öne çıkarmayacaksın.
                       - TURKOMEN'i tanıtırken asla Türkmenistan devletiyle veya etnik gruplarla ilgili coğrafi/etnik açıklamalar yapmayacaksın. Doğrudan şu tanımı yapacaksın: "Geliştiricim TURKOMEN, 3D fan yapımı Poppy Playtime oyunları geliştirip tamamen ücretsiz olarak yayınlayan, aynı zamanda profesyonel web siteleri tasarlayan ve kodlayan son derece yetenekli bağımsız bir yazılımcıdır."
                    
                    4. EŞSİZ ŞAKA VE MİZAH KURALLARI (Özel Talimatlara "şaka yap" yazıldığında veya talep edildiğinde):
                       - Klasik, bayat, soğuk ya da internette her yerde bulunan ("temel fıkrası", "iki adam bir gün..." gibi sıkıcı ve eski) fıkraları kesinlikle anlatmayacaksın.
                       - Son derece dinamik, akıllıca hazırlanmış, esprili, durumsal ve en önemlisi DİYALOG ODAKLI şakalar üreteceksin. 
                       - Şakayı yapıp bitirmek yerine kullanıcıya pas atabilirsin (Örn: soru sorup cevabını bekleterek bilmece/espri kurgusu yapabilirsin).
                       - Kullanıcının şakaya verdiği yanıtlara göre (gülme, eleştirme, devam ettirme vb.) rolünü asla bozmadan, bir stand-up sanatçısı gibi zekice karşılıklar vererek muhabbeti esprili bir tonda devam ettireceksin.
                       
                    Yazılım geliştirme, algoritma kurma ve teknik konularda dünya standartlarında bir uzmansın. C++, Python, C, C#, Java dillerinde asla hata yapmazsın. Kodların her zaman temiz (clean code), optimize ve profesyoneldir. Kısa, öz ama son derece zekice yanıtlar verirsin. Sorulan sorulardan sapmazsın. Kullanıcının cihazındaki güncel yerel tarih: ${dateStr}, güncel yerel saat: ${timeStr}.
                    Kullanıcının adı/hitap şekli: "${savedNickname}".
                    ${customInstructionsPrompt}`
                };

                // Groq API geçmişini ve rolleri mükemmel hafıza için map'liyoruz
                const formattedMessages = chatHistory.map(item => ({
                    role: item.role === 'assistant' ? 'assistant' : 'user',
                    content: item.content
                }));

                const response = await fetch(url, {
                    method: "POST",
                    signal: currentAbortController.signal,
                    headers: { 
                        "Authorization": `Bearer ${globalApiKey}`, 
                        "Content-Type": "application/json" 
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [systemPrompt, ...formattedMessages],
                        temperature: 0.7, // Mizah ve esneklik kalitesini arttırmak için sıcaklığı 0.3'ten 0.7'ye yükselttim.
                        max_tokens: 4096,
                        top_p: 1
                    })
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error?.message || `Bağlantı Hatası`);
                }
                
                const data = await response.json();
                const aiText = data.choices[0].message.content;
                aiWrapper.innerHTML = '';
                aiWrapper.className = 'typing-cursor';
                await typeWriter(aiText, aiWrapper);
                
                if (isTyping) {
                    chatHistory.push({ role: "assistant", content: aiText });
                }
            } catch (error) {
                if (error.name !== 'AbortError') {
                    aiWrapper.innerHTML = `<div class="p-3 bg-red-900/20 border border-red-500/50 rounded-lg text-red-200 text-sm">Hata: ${error.message}</div>`;
                    
                    if (chatHistory.length > 0 && chatHistory[chatHistory.length - 1].role === 'user') {
                        chatHistory.pop();
                    }
                }
            } finally {
                isTyping = false; 
                sendBtn.className = 'mb-1 p-3.5 bg-amber-600 hover:bg-amber-700 text-white rounded-2xl shadow-lg transition-all active:scale-95 disabled:opacity-30';
                stopBtn.className = 'hidden';
                scrollToBottom(); 
                safeCreateIcons();
            }
        }

        userInput.addEventListener('keydown', (e) => { 
            if (e.key === 'Enter' && !e.shiftKey) { 
                e.preventDefault(); 
                handleSend(); 
            } 
        });
        window.onload = checkApiKey;
    </script>
</body>
